<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pricewise UAE – compare electronics prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#12202b;--mute:#5d6d78;--line:#dbe3e8;--acc:#0e7c7b;--acc-ink:#fff;--gold:#f0c35b;--gold-ink:#4a3600;--bar:#c9d6dd;--best:#0e7c7b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d161d;--card:#15222b;--ink:#e8eff3;--mute:#93a5b0;--line:#26363f;--acc:#3cc0bd;--acc-ink:#04201f;--gold:#f0c35b;--gold-ink:#2b2000;--bar:#2c3f4a;--best:#3cc0bd}}
:root[data-theme="dark"]{--bg:#0d161d;--card:#15222b;--ink:#e8eff3;--mute:#93a5b0;--line:#26363f;--acc:#3cc0bd;--acc-ink:#04201f;--gold:#f0c35b;--gold-ink:#2b2000;--bar:#2c3f4a;--best:#3cc0bd}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;margin:0;line-height:1.15}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.logo b{color:var(--acc)}
.tools{display:flex;gap:8px}
.tools button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.hero{padding:26px 0 18px}
.hero h1{font-size:clamp(30px,6vw,52px);font-weight:800;letter-spacing:-.03em;max-width:15em}
.hero p{color:var(--mute);margin:10px 0 20px;max-width:34em}
.search{display:flex;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:6px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;padding:10px 12px}
.search input:focus{outline:0}
.search:focus-within{border-color:var(--acc)}
.search button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:9px;padding:0 20px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px}
.chips button{flex:none;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px;color:var(--mute);font-size:14px;flex-wrap:wrap}
.bar select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.list{display:grid;gap:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.p-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.p h3{font-size:20px;font-weight:600}
.spec{color:var(--mute);font-size:14px;margin-top:2px}
.from{text-align:end}
.from .n{font:800 28px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.from .n small{font-size:14px;font-weight:600;color:var(--mute);margin-inline-end:4px}
.save{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:600;font-size:13px;border-radius:6px;padding:2px 8px}
.ladder{margin-top:14px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;font-size:14px}
.row .s{font-weight:600}
.track{height:26px;background:transparent;position:relative}
.fill{position:absolute;inset-block:0;inset-inline-start:0;background:var(--bar);border-radius:6px;display:flex;align-items:center;padding-inline:8px;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden}
.row.best .fill{background:var(--best);color:var(--acc-ink);font-weight:600}
.go{display:inline-block;text-decoration:none;border:1px solid var(--ink);border-radius:8px;padding:5px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.row.best .go{background:var(--ink);color:var(--bg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--mute);font-size:12.5px}
.foot svg{width:120px;height:28px;flex:none}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.note{margin:28px 0 40px;padding:14px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);font-size:13.5px}
@media(max-width:560px){.row{grid-template-columns:84px 1fr auto;font-size:13px}.from{text-align:start}.go{padding:5px 9px}}
@media(prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}

.offer{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.offer.best{border:2px solid var(--best)}
.offer img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px}
.offer .t{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.offer .m{color:var(--mute);font-size:13px;margin-top:2px}
.offer .r{text-align:end}
.offer .pr{font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.offer .pr small{font-size:13px;color:var(--mute);margin-inline-end:3px}
.offer .go{margin-top:6px}
.offer.best .go{background:var(--ink);color:var(--bg)}
.tag{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:600;font-size:12px;border-radius:6px;padding:1px 8px;margin-inline-end:6px}
@media(max-width:560px){.offer{grid-template-columns:52px 1fr}.offer img{width:52px;height:52px}.offer .r{grid-column:1/-1;text-align:start;display:flex;justify-content:space-between;align-items:center}.offer .go{margin:0}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="logo">Price<b>wise</b> UAE</div><div class="tools"><button id="lang" type="button">العربية</button></div></header>
<section class="hero">
<h1 id="t-h"></h1><p id="t-p"></p>
<form class="search" role="search" id="f"><input id="q" type="search" autocomplete="off" aria-label="Search"><button type="submit" id="t-go"></button></form>
<div class="chips" id="chips"></div>
</section>
<div class="bar"><span id="status"></span></div>
<main class="list" id="list" aria-live="polite"></main>
<p class="note" id="t-note"></p>
</div>
<script>
var L={en:{h:"One search. Every UAE store. The lowest total price.",p:"We compare electronics across UAE retailers and rank by what you actually pay, delivery included.",go:"Search",ph:"Search e.g. iPhone 16, PS5, AirPods",view:"View deal",free:"Free delivery",ship:"delivery",best:"Lowest total",load:"Searching UAE stores…",res:"offers for",none:"No offers found. Try a brand or model, like “Galaxy S24”.",err:"Could not load prices.",upd:"Updated",lang:"العربية",note:"Prices come from Google Shopping listings for the UAE and can change at any time; confirm on the store’s page before buying. Some links may be affiliate links: if you buy, we may earn a commission at no extra cost to you.",pop:["iPhone 16","PS5","AirPods Pro","Galaxy S24","MacBook Air"]},
ar:{h:"بحث واحد. كل متاجر الإمارات. أقل سعر إجمالي.",p:"نقارن الإلكترونيات بين متاجر الإمارات ونرتبها حسب ما تدفعه فعلاً، شاملاً التوصيل.",go:"بحث",ph:"ابحث مثلاً: iPhone 16 أو PS5",view:"عرض العرض",free:"توصيل مجاني",ship:"توصيل",best:"أقل إجمالي",load:"جارٍ البحث في متاجر الإمارات…",res:"عرض لـ",none:"لا توجد عروض. جرّب علامة تجارية أو طراز مثل Galaxy S24.",err:"تعذّر تحميل الأسعار.",upd:"آخر تحديث",lang:"English",note:"الأسعار من قوائم Google Shopping في الإمارات وقد تتغير في أي وقت؛ تأكد من صفحة المتجر قبل الشراء. قد تكون بعض الروابط روابط إحالة: إذا اشتريت قد نحصل على عمولة دون أي تكلفة إضافية عليك.",pop:["iPhone 16","PS5","AirPods Pro","Galaxy S24","MacBook Air"]}};
var lang="en",last="",qEl=document.getElementById("q"),seq=0;
function T(k){return L[lang][k]}
function fmt(n){return n.toLocaleString(lang==="ar"?"ar-AE":"en-US")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function safe(u){return/^https?:\/\//i.test(u)?u:"#"}
function text(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.getElementById("t-h").textContent=T("h");document.getElementById("t-p").textContent=T("p");
  document.getElementById("t-go").textContent=T("go");document.getElementById("t-note").textContent=T("note");
  document.getElementById("lang").textContent=T("lang");qEl.placeholder=T("ph");
  document.getElementById("chips").innerHTML=T("pop").map(function(s){return'<button type="button">'+s+'</button>'}).join("");
  if(last)search(last)
}
function search(q){
  q=q.trim().toLowerCase();if(q.length<2)return;last=q;var my=++seq;
  var st=document.getElementById("status"),el=document.getElementById("list");
  st.textContent=T("load");el.innerHTML="";
  fetch("/api/search?q="+encodeURIComponent(q)).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})}).then(function(x){
    if(my!==seq)return;
    if(!x.ok){st.textContent=x.d.error||T("err");return}
    var r=x.d.results;
    if(!r.length){st.textContent="";el.innerHTML='<div class="empty">'+T("none")+'</div>';return}
    st.textContent=r.length+" "+T("res")+" “"+q+"” · "+T("upd")+" "+new Date(x.d.updated).toLocaleTimeString(lang==="ar"?"ar-AE":"en-GB",{hour:"2-digit",minute:"2-digit"});
    el.innerHTML=r.map(function(o,i){
      var del=o.free?T("free"):(o.ship?("+AED "+fmt(o.ship)+" "+T("ship")):esc(o.delivery||""));
      return'<article class="offer'+(i===0?" best":"")+'">'+(o.image?'<img src="'+esc(o.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<div></div>')+
      '<div><div class="t">'+esc(o.title)+'</div><div class="m">'+(i===0?'<span class="tag">'+T("best")+'</span>':"")+esc(o.store)+(del?" · "+del:"")+'</div></div>'+
      '<div class="r"><div class="pr"><small>AED</small>'+fmt(o.total)+'</div><a class="go" target="_blank" rel="noopener sponsored" href="'+esc(safe(o.link))+'">'+T("view")+'</a></div></article>'}).join("");
  }).catch(function(){if(my===seq)st.textContent=T("err")});
}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();search(qEl.value)});
document.getElementById("chips").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;qEl.value=b.textContent;search(b.textContent)});
document.getElementById("lang").addEventListener("click",function(){lang=lang==="en"?"ar":"en";text()});
text();
</script>
</body>
</html>
